<style>
/* Layout: a calm daily notebook — sticky top bar, one reading column, the year drawn as 365 tiles */
:root {
  --bg: #f6efe4;          /* creme */
  --surface: #fffaf2;
  --ink: #3b2a22;         /* marrom */
  --ink-soft: #6f5a4d;
  --line: #e3d6c4;
  --accent: #7a1f2b;      /* bordô */
  --accent-ink: #fffaf2;
  --accent-soft: #f1dcdc;
  --tile-empty: #ebe0d0;
  --tile-mid: #c98a8f;
  --good: #3f6b45;
  --font-display: "Young Serif", Georgia, "Times New Roman", serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1e1613; --surface: #281e1a; --ink: #f1e6d8; --ink-soft: #c2ad9c; --line: #3d2f28;
    --accent: #d77b86; --accent-ink: #1e1613; --accent-soft: #3a2226;
    --tile-empty: #352823; --tile-mid: #8a4a52; --good: #8fbf91; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1e1613; --surface: #281e1a; --ink: #f1e6d8; --ink-soft: #c2ad9c; --line: #3d2f28;
  --accent: #d77b86; --accent-ink: #1e1613; --accent-soft: #3a2226;
  --tile-empty: #352823; --tile-mid: #8a4a52; --good: #8fbf91; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--accent); }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.narrow { max-width: 720px; }

/* top bar */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 16px; padding-block: 10px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-size: 1.25rem; color: var(--ink); text-decoration: none; white-space: nowrap; }
.brand b { color: var(--accent); font-weight: 400; }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; margin-left: auto; max-width: 100%; }
nav.tabs a { text-decoration: none; color: var(--ink-soft); font-weight: 600; font-size: .9rem; padding: 6px 10px; border-radius: 999px; white-space: nowrap; }
nav.tabs a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }

main { padding-block: 28px 64px; }
h1, h2, h3 { text-wrap: balance; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.9rem, 4vw, 2.6rem); line-height: 1.15; margin: 0 0 8px; }
h2.section { font-family: var(--font-display); font-weight: 400; font-size: 1.45rem; margin: 40px 0 12px; }
.eyebrow { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-soft); }
.lede { font-size: 1.1rem; color: var(--ink-soft); max-width: 60ch; margin: 0; }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font: 600 .95rem var(--font-body); padding: 10px 16px; border-radius: 999px; cursor: pointer; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.small { padding: 6px 12px; font-size: .85rem; }
.btn:disabled { opacity: .45; cursor: default; }

/* today card */
.today { margin-top: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; display: grid; grid-template-columns: auto 1fr; gap: 6px 20px; align-items: start; }
.today .daynum { font-family: var(--font-display); font-size: 3.4rem; line-height: 1; color: var(--accent); grid-row: span 3; }
.today h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; line-height: 1.25; min-width: 0; }
.today .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
@media (max-width: 520px) { .today { grid-template-columns: 1fr; } .today .daynum { grid-row: auto; font-size: 2.6rem; } }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: .78rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-soft); background: var(--bg); white-space: nowrap; }
.chip.accent { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

/* stats */
.stats { display: flex; flex-wrap: wrap; gap: 10px 28px; margin-top: 18px; }
.stat b { font-family: var(--font-mono); font-size: 1.3rem; font-weight: 500; display: block; }
.stat span { font-size: .82rem; color: var(--ink-soft); }

/* year grid */
.cycle { margin-top: 22px; }
.cycle-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 8px; }
.cycle-head h3 { margin: 0; font-size: 1rem; }
.cycle-head .muted { font-size: .85rem; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(22px, 1fr)); gap: 4px; }
.tile { aspect-ratio: 1; max-width: 100%; border-radius: 4px; background: var(--tile-empty); border: 0; padding: 0; cursor: pointer; position: relative; }
.tile.f-w, .tile.f-r, .tile.f-p { border-radius: 50%; }
.tile.s1 { background: var(--tile-mid); }
.tile.s2 { background: var(--accent); }
.tile.next { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .82rem; color: var(--ink-soft); margin-top: 14px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; background: var(--tile-empty); }
.legend i.s1 { background: var(--tile-mid); } .legend i.s2 { background: var(--accent); } .legend i.round { border-radius: 50%; }

.note { margin-top: 26px; padding: 14px 16px; border-left: 3px solid var(--accent); background: var(--surface); border-radius: 0 var(--radius) var(--radius) 0; font-size: .92rem; color: var(--ink-soft); max-width: 72ch; }

/* journey list */
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 16px 0; }
.filters label { display: grid; gap: 4px; font-size: .78rem; font-weight: 600; color: var(--ink-soft); }
select, input[type="search"], textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
.list { display: grid; gap: 0; border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 3.2rem 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.row:hover { background: var(--surface); }
.row .n { font-family: var(--font-mono); color: var(--ink-soft); }
.row .t { font-weight: 600; min-width: 0; }
.row .chips { grid-column: 2 / 4; }
.pill { font-size: .75rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.pill.s0 { color: var(--ink-soft); border: 1px solid var(--line); }
.pill.s1 { color: var(--accent); border: 1px solid var(--accent); }
.pill.s2 { color: var(--accent-ink); background: var(--accent); }
.count { font-size: .88rem; color: var(--ink-soft); }

/* day page */
.dayhead { display: grid; gap: 10px; }
.dayhead .num { font-family: var(--font-mono); color: var(--accent); font-weight: 500; }
.content { margin-top: 18px; max-width: 68ch; }
.content h2, .content h3 { font-family: var(--font-display); font-weight: 400; margin: 28px 0 8px; font-size: 1.25rem; }
.content h3 { font-size: 1.1rem; }
.content ul, .content ol { padding-left: 1.3rem; }
.content li { margin: 4px 0; }
.content em { color: var(--accent); font-style: italic; }
.content .callout { background: var(--accent-soft); border-radius: var(--radius); padding: 4px 16px; margin: 12px 0; }
.content .tablewrap { overflow-x: auto; }
.content table { border-collapse: collapse; margin: 10px 0; font-size: .95rem; font-variant-numeric: tabular-nums; }
.content th, .content td { border-bottom: 1px solid var(--line); padding: 6px 12px 6px 0; text-align: left; }
.content th { font-size: .8rem; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-soft); }
.resource { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 12px 14px; border: 1px dashed var(--line); border-radius: var(--radius); max-width: 68ch; }
.resource .muted { font-size: .82rem; }
.mywork { margin-top: 30px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; max-width: 68ch; display: grid; gap: 12px; }
.mywork h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.2rem; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { font: 600 .88rem var(--font-body); padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
textarea { min-height: 110px; resize: vertical; }
.saved { font-size: .8rem; color: var(--good); min-height: 1.2em; }
.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 26px; max-width: 68ch; flex-wrap: wrap; }

/* prose pages */
.prose { max-width: 68ch; }
.prose h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.35rem; margin: 32px 0 8px; }
.prose li { margin: 4px 0; }
.path { display: grid; gap: 10px; margin: 14px 0; padding: 0; list-style: none; }
.path li { display: grid; grid-template-columns: 7.5rem 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.path li .mono { color: var(--accent); }
@media (max-width: 520px) { .path li { grid-template-columns: 1fr; gap: 2px; } }
details { border-bottom: 1px solid var(--line); padding: 12px 0; }
details summary { cursor: pointer; font-weight: 600; }
details p { margin: 8px 0 0; color: var(--ink-soft); }
.copyline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.copyline code { font-family: var(--font-mono); background: var(--surface); border: 1px solid var(--line); padding: 4px 8px; border-radius: 6px; user-select: all; word-break: break-all; }
.backup { display: grid; gap: 10px; margin-top: 12px; }
.lockform { display: grid; gap: 10px; max-width: 420px; margin-top: 22px; }
.lockform input[type="password"] { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%; }
.remember { display: flex; align-items: center; gap: 8px; font-size: .92rem; color: var(--ink-soft); }
footer { border-top: 1px solid var(--line); padding-block: 20px; font-size: .82rem; color: var(--ink-soft); }
@media (prefers-reduced-motion: no-preference) { .tile { transition: transform .12s ease; } .tile:hover { transform: scale(1.15); } }
</style>

  function renderList() {
    var v = {}; ["cycle", "format", "skill", "status", "q"].forEach(function (k) { v[k] = document.getElementById("f-" + k).value; });
    try { sessionStorage.setItem("ei365:filters", JSON.stringify(v)); } catch (e) {}
    var q = v.q.trim().toLowerCase();
    var rows = DAYS.filter(function (d) {
      if (v.cycle && cycleOf(d.n).id !== +v.cycle) return false;
      if (v.format && d.f !== v.format) return false;
      if (v.skill && d.s.indexOf(v.skill) < 0) return false;
      if (v.status !== "" && rec(d.n).s !== +v.status) return false;
      if (q && (pad(d.n) + " " + d.t).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });

  /* ---- router ---- */
  function route() {
    var hsh = (location.hash || "#hoje").slice(1), tab = hsh;
    var m = /^dia-(\d{1,3})$/.exec(hsh);
    var open = hsh === "comecar" || hsh === "ajuda" || hsh === "termos";
    if (!DAYS && !open) {
      viewLock();
      document.querySelectorAll("nav.tabs a").forEach(function (a) { if (a.dataset.tab === (m ? "jornada" : (hsh === "jornada" ? "jornada" : "hoje"))) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
      return;
    }
    if (m) { viewDay(Math.min(365, Math.max(1, +m[1]))); tab = "jornada"; }
    else if (hsh === "jornada") viewJourney();
    else if (hsh === "comecar") viewStart();
    else if (hsh === "ajuda") viewHelp();
    else if (hsh === "termos") { viewTerms(); tab = ""; }
    else { viewHome(); tab = "hoje"; }
    document.querySelectorAll("nav.tabs a").forEach(function (a) { if (a.dataset.tab === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    if (!m) window.scrollTo(0, 0);
  }
  load();
  window.addEventListener("hashchange", route);
  window.addEventListener("storage", function (e) { if (e.key === KEY) { load(); if (DAYS) route(); } });
  app.innerHTML = '<p class="muted">Abrindo…</p>';
  tryStoredKey().then(route, route);
})();
